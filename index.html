const state={section:null,index:0,answered:false,selected:null,lastCorrect:false,score:{}};
const $=id=>document.getElementById(id);
function save(){localStorage.setItem('picu-sba-state',JSON.stringify(state));}
function load(){try{const s=JSON.parse(localStorage.getItem('picu-sba-state'));if(s&&s.score)state.score=s.score}catch(e){}}
function renderMenu(){
 $('menu').innerHTML=DATA.sections.map((s,i)=>`<button class="sec" data-s="${i}">${i+1}. ${s}<span class="count">${state.score[s]||0}/20</span></button>`).join('');
 document.querySelectorAll('.sec').forEach(b=>b.onclick=()=>openSection(+b.dataset.s));
}
function home(){state.section=null;$('secTitle').textContent='PICU SBA Master';$('secSub').textContent='Choose one of 24 study sections';$('content').innerHTML=`<div class="home"><h3>480 source-based single-best-answer questions</h3><p>Each section contains 20 four-choice questions. Select an answer to get immediate green/red marking, then continue with Next.</p><p><b>Important:</b> this app is built from the supplied PICU notes. Where the notes are sparse, the app does not claim to replace current guidelines.</p></div><div class="grid">${DATA.sections.map((s,i)=>`<div class="section-card" onclick="openSection(${i})"><strong>${i+1}. ${s}</strong><span>${state.score[s]||0}/20 correct</span></div>`).join('')}</div>`;renderMenu();save()}
function openSection(i){state.section=i;state.index=0;state.answered=false;state.selected=null;state.lastCorrect=false;state.score[DATA.sections[i]]=0;$('secTitle').textContent=DATA.sections[i];$('secSub').textContent='20 questions · source-based revision';renderMenu();document.querySelectorAll('.sec')[i]?.classList.add('active');renderQ()}
function qlist(){const s=DATA.sections[state.section];return DATA.questions.filter(q=>q.section===s)}
function visual(q){if(!q.visual)return '';let s=q.section.toLowerCase();if(s.includes('theory'))return `<div class="visual"><b>Arterial waveform cue</b><svg class="wave" viewBox="0 0 500 100" preserveAspectRatio="none"><polyline fill="none" stroke="currentColor" stroke-width="3" points="0,80 60,80 85,20 100,72 120,55 150,68 220,70 300,72 380,73 500,74"/></svg><small>Use the shape to distinguish damping patterns described in the notes.</small></div>`;if(s.includes('ards'))return `<div class="visual"><b>ARDS bedside calculation</b><div class="diagram"><div class="box">FiO₂</div><div class="arrow">×</div><div class="box">Mean airway pressure</div><div class="arrow">÷</div><div class="box">PaO₂</div><div class="arrow">×100</div><div class="box">Oxygenation index</div></div></div>`;if(s.includes('apls')||s.includes('code blue'))return `<div class="visual"><b>Resuscitation flow</b><div class="diagram"><div class="box">Recognise arrest</div><div class="arrow">→</div><div class="box">CPR + monitor</div><div class="arrow">→</div><div class="box">Rhythm / 4H–4T</div><div class="arrow">→</div><div class="box">Adrenaline / defib as indicated</div></div></div>`;if(s.includes('electrolytes'))return `<div class="visual"><b>Na disorder pattern in the notes</b><div class="diagram"><div class="box">SIADH<br>low Na · concentrated urine</div><div class="box">CSW<br>low Na · polyuria</div><div class="box">DI<br>high Na · dilute urine</div></div></div>`;return `<div class="visual"><b>Revision cue</b><div class="diagram"><div class="box">Recall</div><div class="arrow">→</div><div class="box">Apply</div><div class="arrow">→</div><div class="box">Check against notes</div></div></div>`}
function renderQ(){const qs=qlist(),q=qs[state.index];if(!q)return home();const answered=state.answered;let visualHtml=visual(q);$('content').innerHTML=`<div class="score">Question ${state.index+1} of ${qs.length} · ${state.score[DATA.sections[state.section]]||0}/20 correct</div><div class="progress"><div class="bar" style="width:${((state.index)/20)*100}%"></div></div><div class="card"><div class="qmeta">${DATA.sections[state.section]}</div>${visualHtml}<div class="stem">${esc(q.q)}</div><div id="opts">${q.options.map((o,i)=>{let cls='opt';if(answered&&i===q.answer)cls+=' correct';if(answered&&i===state.selected&&i!==q.answer)cls+=' incorrect';return `<button class="${cls}" data-i="${i}" ${answered?'disabled':''}><span class="letter">${'ABCD'[i]}.</span>${esc(o)}</button>`}).join('')}</div>${answered?`<div class="feedback"><b>${state.lastCorrect?'Correct':'Incorrect'}</b><br>${esc(q.explanation)}</div>`:''}<div class="actions"><button class="control" onclick="prevQ()" ${state.index===0?'disabled':''}>Previous</button><button class="primary" id="next" onclick="nextQ()" ${answered?'':'disabled'}>${state.index===19?'Finish section':'Next'}</button></div><div class="source-note">Source: supplied PICU notes (Sia 1.2.21). The wording is paraphrased for SBA format.</div></div>`;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
}
function choose(i){if(state.answered)return;const qs=qlist(),q=qs[state.index];state.selected=i;state.answered=true;state.lastCorrect=i===q.answer;const s=DATA.sections[state.section];state.score[s]=state.score[s]||0;if(state.lastCorrect)state.score[s]++;renderMenu();renderQ();}
function nextQ(){if(!state.answered)return;if(state.index<19){state.index++;state.answered=false;state.selected=null;renderQ()}else{finish()}}
function prevQ(){if(state.index>0){state.index--;state.answered=false;state.selected=null;renderQ()}}
function finish(){const s=DATA.sections[state.section],score=state.score[s]||0;$('content').innerHTML=`<div class="card"><h2>${esc(s)} complete</h2><p>Your score for this run is <b>${score}/20</b>. You can revisit the section or choose another one.</p><div class="actions"><button class="control" onclick="openSection(${state.section})">Restart section</button><button class="primary" onclick="home()">Back to sections</button></div></div>`;renderMenu();save()}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
$('homeBtn').onclick=home;load();home();
</script></body></html>
